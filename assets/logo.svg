<svg xmlns="http://www.w3.org/2000/svg" width="640" height="170" viewBox="0 0 640 170" role="img" aria-label="continuo">
  <defs>
    <linearGradient id="staff" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94A3B8" stop-opacity="0"/>
      <stop offset="0.08" stop-color="#94A3B8" stop-opacity="0.55"/>
      <stop offset="0.92" stop-color="#94A3B8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#94A3B8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- the staff: five lines, edge to edge, fading out — they never end -->
  <g fill="url(#staff)">
    <rect x="0" y="49" width="640" height="2"/>
    <rect x="0" y="64" width="640" height="2"/>
    <rect x="0" y="79" width="640" height="2"/>
    <rect x="0" y="94" width="640" height="2"/>
    <rect x="0" y="109" width="640" height="2"/>
  </g>

  <!-- the word, letters riding the staff like notes -->
  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
     font-size="52" fill="#64748B">
    <text x="150" y="94">c</text>
    <text x="201" y="87">o</text>
    <text x="255" y="79">n</text>
    <text x="311" y="87">t</text>
    <text x="355" y="94">i</text>
    <text x="397" y="102">n</text>
    <text x="453" y="94">u</text>
    <text x="509" y="87">o</text>
  </g>

  <!-- do: the note the piece never resolves away from — after the word,
       in its own color so it reads as music, not as a letter -->
  <g fill="#D97706">
    <ellipse cx="574" cy="94" rx="11" ry="8" transform="rotate(-18 574 94)"/>
    <rect x="582.4" y="46" width="3.8" height="48" rx="1.9"/>
  </g>
</svg>
