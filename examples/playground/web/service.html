<section class="card service-card" data-service="{{name}}">
  <div class="card-heading"><span class="eyebrow">MANAGED RUNNABLE</span><span class="badge neutral" data-field="status">{{status}}</span></div>
  <h2>{{name}}</h2>
  <dl class="service-metrics">
    <div><dt>Generation</dt><dd data-field="generation">{{generation}}</dd></div>
    <div><dt>Reload revision</dt><dd data-field="reload_revision">{{revision}}</dd></div>
    <div><dt>Reloadable</dt><dd data-field="reloadable">{{reloadable}}</dd></div>
  </dl>
  <div class="runtime-details"><code data-field="snapshot">{{snapshot}}</code></div>
</section>
