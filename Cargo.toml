[package]
name = "continuo"
version = "0.9.0"
edition = "2024"
# Let-chains, used ungated in runtime.rs, gate.rs and events.rs.
rust-version = "1.88"
authors = ["iadev09 <iadev09@claviron.org>"]
description = "Runtime service composition for multi-service Rust applications: typed component resolution, dependency-ordered lifecycle, reload, runnable tasks, graceful drain, and finalization."
license = "MIT OR Apache-2.0"
repository = "https://github.com/iadev09/continuo"
documentation = "https://docs.rs/continuo"
keywords = ["dependency-injection", "dependency", "ioc", "lifecycle", "registry"]
categories = ["asynchronous", "rust-patterns"]
exclude = ["/Cargo.lock", "/justfile", "/rustfmt.toml", "/.idea/**"]

[features]
default = ["registry"]
full = ["registry", "support", "events", "config", "config-watch", "fleet"]
fleet = ["dep:serde", "dep:humantime-serde"]
events = ["dep:dashmap"]
# Typed configuration through Congif: `Configurable`, `Component::as_configurable`,
# reload acknowledgement; with `registry`, `Runtime::configure` / `prepare`.
config = ["dep:congif"]
# Native source watching on top of `config`; needs the event bus and registry.
config-watch = ["config", "events", "registry", "congif/watch"]
registry = []
support = []

[package.metadata.docs.rs]
# `gate`, `guard`, `events`, `config` and `fleet` are behind features; without
# this docs.rs renders the registry and nothing else.
all-features = true

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"], optional = true }
humantime-serde = { version = "1", optional = true }
congif = { version = "0.0.1", optional = true }
dashmap = { version = "6", optional = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
continuo = { path = ".", features = ["full"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
axum = "0.8"
dotenw = "0.0.1"
congif = { version = "0.0.1", features = ["json", "toml", "watch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
futures-util = "0.3"
humantime-serde = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }

[[example]]
name = "playground"
path = "examples/playground/main.rs"
