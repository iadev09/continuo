[package]
name = "continuo"
version = "0.8.1"
edition = "2024"
# Let-chains, used ungated in runtime.rs, gate.rs and events.rs.
rust-version = "1.88"
authors = ["iadev09 <iadev09@claviron.org>"]
description = "Runtime service composition for multi-service Rust applications: typed provider resolution, dependency-ordered lifecycle, reload, runnable tasks, graceful drain, and finalization."
license = "MIT OR Apache-2.0"
repository = "https://github.com/iadev09/continuo"
documentation = "https://docs.rs/continuo"
readme = "README.md"
keywords = ["dependency-injection", "dependency", "ioc", "lifecycle", "registry"]
categories = ["asynchronous", "rust-patterns"]
exclude = ["/Cargo.lock", "/justfile", "/rustfmt.toml", "/.idea/**"]

[features]
default = ["registry"]
full = ["registry", "support", "events","config-watch"]
events = ["dep:dashmap"]
config-watch = ["events", "registry", "congif/watch"]
registry = []
support = []

[package.metadata.docs.rs]
# `gate`, `guard` and `events` are behind features; without this docs.rs
# renders the registry and nothing else.
all-features = true

[dependencies]
async-trait = "0.1"
congif = { path = "../congif" }
dashmap = { version = "6", optional = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
continuo = { path = ".", features = ["full"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
axum = "0.8"
dotenvy = "0.15"
congif = { path = "../congif", features = ["json", "watch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }

[[example]]
name = "playground"
path = "examples/playground/main.rs"
